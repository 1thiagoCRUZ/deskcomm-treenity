name: Funil de leads do Treenity Bot (agendado)

# Sincroniza os atendimentos do Treenity Bot que já viraram negociação com o
# funil dedicado no deskcomm (crm_leads) — ver lib/treenity-bot/funil-de-leads.ts.
# O navegador de um admin já dispara isto na hora quando o painel avisa de
# atendimento/venda nova; este workflow é a rede de segurança para quando
# ninguém está com o painel aberto.
#
# ⚠️ `schedule:` do GitHub Actions só roda na branch DEFAULT do repositório —
# mesma pegadinha documentada em relogio.yml e treenity-vendas.yml. O recurso
# em si é ligado pelo cliente na tela (aba "Automações" da integração, não
# env var) — organização sem ele ligado não gera nada.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: treenity-funil
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chama /api/v1/cron/treenity-funil
        env:
          APP_URL: ${{ vars.PROD_URL }}
          SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ] || [ -z "${SECRET}" ]; then
            echo "::error::A variável de repositório PROD_URL ou o secret INTERNAL_SECRET não estão configurados."
            exit 1
          fi
          CORPO=$(mktemp)
          CODIGO=$(curl -sS -o "$CORPO" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            --max-time 90 \
            "${APP_URL%/}/api/v1/cron/treenity-funil" || echo "000")
          echo "HTTP ${CODIGO}"
          cat "$CORPO"
          echo
          case "${CODIGO}" in
            2??) echo "sincronismo ok" ;;
            *) echo "::error::rota devolveu ${CODIGO}"; exit 1 ;;
          esac
